[package]
name = "mini-archipel-agent"
version = "0.6.0"
edition = "2021"
description = "Metrics collection agent for the mini-archipel console"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sysinfo = "0.33"
toml = "0.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
