name: Console checks
on:
  push:
    paths: ['console/**', 'agent/**', '.github/workflows/console.yml']
  pull_request:
    paths: ['console/**', 'agent/**', '.github/workflows/console.yml']
permissions:
  contents: read
concurrency:
  group: console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run audit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-report-node-${{ matrix.node }}
          path: |
            console/playwright-report
            console/test-results
          retention-days: 7

  agent:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - run: npm ci
      - run: npm run check:agent
