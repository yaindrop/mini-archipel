name: PR Quality
run-name: "PR #${{ github.event.pull_request.number }} · Quality"
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event.label.name == 'run-ci' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-quality.yml
    with:
      runs-on: '["self-hosted","macOS","ARM64","ci"]'
      engine-ref: ${{ github.sha }}
      fetch-depth: 0
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
