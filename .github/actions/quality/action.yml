name: Quality lifecycle
description: Accept the live environment, then run the repository quality entry.
inputs:
  shared-ref:
    description: Commit of this shared action and workflow.
    required: true
  runs-on:
    description: JSON array of runner labels the job was scheduled with.
    required: true
  pr:
    description: Pull request number from the triggering event.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run the pinned lifecycle
      shell: bash
      env:
        MINI_CI_REQUEST: run-ci
        MINI_CI_SHARED_REF: ${{ inputs.shared-ref }}
        MINI_CI_RUNS_ON: ${{ inputs.runs-on }}
        MINI_CI_PR: ${{ inputs.pr }}
      run: python3 "$GITHUB_ACTION_PATH/ci-run.py"
