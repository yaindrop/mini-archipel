name: PR Quality
run-name: "PR #${{ github.event.pull_request.number }} · Quality"
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event.label.name == 'run-ci' && github.event.pull_request.head.repo.full_name == github.repository
    uses: yaindrop/mini-archipel/.github/workflows/reusable-quality.yml@a463077e0c2ecf8b199da8175bb6e0a2848f6cf7
    with:
      runs-on: '["self-hosted","macOS","ARM64","ci"]'
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
